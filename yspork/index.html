<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>儲能案場 3D 展示｜2×5 背對背</title>
<style>*{box-sizing:border-box}body{margin:0;background:#b5d6ed;font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#16374a;overflow:hidden}#scene{position:fixed;inset:0}#loading{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);padding:20px;background:#fff;border-radius:12px}.panel{position:absolute;background:#ffffffeb;border:1px solid white;box-shadow:0 10px 35px #32536c31;border-radius:16px;backdrop-filter:blur(10px)}header{top:18px;left:18px;padding:15px 20px}header strong{font-size:19px}header small{display:block;color:#628397;margin-top:5px}aside{right:18px;top:18px;padding:17px;width:250px}h2{font-size:17px;margin:0 0 10px}.data{display:flex;justify-content:space-between;border-bottom:1px solid #dae4ea;padding:10px 0;font-size:13px}.data b{color:#007b8a}.hint{position:absolute;bottom:95px;left:20px;background:#ffffffc7;padding:10px;border-radius:10px;font-size:12px}nav{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#ffffffec;border-radius:15px;padding:7px;display:flex;gap:5px;box-shadow:0 8px 30px #3456}button{border:0;border-radius:9px;padding:11px 13px;background:transparent;color:#30566a;font-weight:700;cursor:pointer;white-space:nowrap}button:hover,button.active{background:#075e77;color:white}#info{display:none;position:absolute;top:155px;left:18px;width:245px;padding:16px}#info.show{display:block}#info p{font-size:13px;line-height:1.6}#info button{float:right}#photo{display:none;position:absolute;inset:0;z-index:10;place-items:center;background:#163043e6;color:white}#photo.show{display:grid}#photo .photoNote{max-width:440px;line-height:1.8;text-align:center}#photo button{background:white;color:#123} @media(max-width:700px){header{left:9px;top:9px;padding:10px}header strong{font-size:14px}header small{font-size:9px}aside{right:9px;top:78px;padding:11px;width:173px}aside h2{font-size:13px}.data{font-size:11px;padding:6px 0}nav{left:9px;right:9px;transform:none;overflow-x:auto;justify-content:flex-start}button{font-size:11px;padding:10px}.hint{left:9px;bottom:83px;font-size:10px}#info{top:180px;left:9px}}</style></head>
<body><div id="scene"></div><div id="loading">正在載入儲能案場 3D 模型…</div><header class="panel"><strong>⚡ 儲能案場 · 3D 展示</strong><small>ENERGY STORAGE SITE · 2 × 5 BACK-TO-BACK</small></header>
<aside class="panel"><h2>案場設備配置</h2><div class="data"><span>設備數量</span><b>10 櫃</b></div><div class="data"><span>排列方式</span><b>2 × 5</b></div><div class="data"><span>配置方向</span><b>背對背</b></div><div class="data"><span>模型狀態</span><b>外觀示意</b></div></aside>
<div class="hint">拖曳旋轉 · 滾輪縮放 · 右鍵平移 · 點擊機櫃查看編號</div><section id="info" class="panel"><button id="close">✕</button><h2 id="cabName"></h2><p>戶外立式儲能櫃模型，包含櫃體、檢視窗、通風百葉、警示標示與吊耳。此為視覺展示，非工程竣工尺寸。</p></section>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const sc=new THREE.Scene();sc.background=new THREE.Color(0xa8d3f6);sc.fog=new THREE.Fog(0xa8d3f6,40,110);
const cam=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,160);cam.position.set(26,15,26);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;ren.toneMapping=THREE.ACESFilmicToneMapping;ren.toneMappingExposure=1.5;document.getElementById('scene').appendChild(ren.domElement);
sc.add(new THREE.HemisphereLight(0xe5f3ff,0x809570,2.4));let sun=new THREE.DirectionalLight(0xffffff,3.1);sun.position.set(-15,25,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;sc.add(sun);
const ctl=new OrbitControls(cam,ren.domElement);ctl.target.set(0,2.5,0);ctl.enableDamping=true;ctl.minDistance=8;ctl.maxDistance=70;ctl.maxPolarAngle=Math.PI/2.02;ctl.update();
const mat=(c,metalness=0)=>new THREE.MeshStandardMaterial({color:c,metalness,roughness:.72}),white=mat(0xeaf1f1,.16),gray=mat(0x9dabaf,.18),dark=mat(0x2c424e,.25),teal=mat(0x079fae,.22),cement=mat(0xb4bcc1),gold=mat(0xe9ca3a),earth=mat(0x849a75),leaf=[mat(0x557e4a),mat(0x426f43),mat(0x6c975a)];
function box(w,h,d,m,x,y,z,p=sc){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
box(100,.14,85,earth,0,-.35,0);box(40,.15,30,cement,0,-.13,0);
for(let x of [-4,4])box(5.05,1.08,13.3,cement,x,.49,0);
const picks=[],tags=[];function makeCab(row,i,x,z,rot){const g=new THREE.Group();g.position.set(x,1.04,z);g.rotation.y=rot;sc.add(g);
const w=3.85,h=5.15,d=2.18;box(w,h,d,white,0,h/2,0,g);box(w+.05,.13,d+.05,dark,0,.07,0,g);
box(.04,h-.15,d-.2,teal,w/2+.01,h/2,0,g);box(.06,h-.2,d-.23,gray,-w/2-.03,h/2,0,g);
box(.05,.68,.58,gray,w/2+.04,4.34,-.3,g);box(.07,.12,.72,dark,w/2+.065,3.54,-.35,g);
box(.08,.99,1.52,gray,w/2+.07,.84,0,g);for(let j=0;j<12;j++)box(.085,.016,1.46,dark,w/2+.12,.39+j*.07,0,g);
box(.06,.25,.21,gold,w/2+.09,2.84,.55,g);box(.05,.13,.16,gold,-.72,.84,d/2+.03,g);
for(const xx of [-1.3,1.3]){const ring=new THREE.Mesh(new THREE.TorusGeometry(.14,.038,8,22),gray);ring.rotation.y=Math.PI/2;ring.position.set(xx,h+.17,0);g.add(ring)}
const hit=box(w+.09,h+.06,d+.09,new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}),0,h/2,0,g);hit.userData.name=row+'第 '+(i+1)+' 櫃';picks.push(hit);
let cv=document.createElement('canvas');cv.width=280;cv.height=85;let ctx=cv.getContext('2d');ctx.fillStyle='#084c61';ctx.fillRect(0,0,280,85);ctx.fillStyle='white';ctx.font='bold 32px sans-serif';ctx.textAlign='center';ctx.fillText(row+' '+(i+1),140,55);let sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));sp.position.set(x,7.1,z);sp.scale.set(2.25,.68,1);sp.visible=false;sc.add(sp);tags.push(sp)}
for(let i=0;i<5;i++){const z=(i-2)*2.21;makeCab('A列',i,-4,z,Math.PI);makeCab('B列',i,4,z,0)}
let seed=42;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<42;i++){const x=(rnd()-.5)*76,z=(rnd()-.5)*67;if(Math.abs(x)<22&&Math.abs(z)<17)continue;box(.18,2.2,.18,mat(0x655d4c),x,1,z);for(let k=0;k<3;k++){let m=new THREE.Mesh(new THREE.IcosahedronGeometry(.9+rnd()*.8,1),leaf[Math.floor(rnd()*3)]);m.position.set(x+(rnd()-.5)*1.5,2.8+rnd()*1.2,z+(rnd()-.5)*1.5);sc.add(m)}}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let start;ren.domElement.addEventListener('pointerdown',e=>start=[e.clientX,e.clientY]);ren.domElement.addEventListener('pointerup',e=>{if(!start||Math.hypot(e.clientX-start[0],e.clientY-start[1])>6)return;mouse.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(mouse,cam);const hit=ray.intersectObjects(picks)[0];document.getElementById('info').classList.toggle('show',!!hit);if(hit)document.getElementById('cabName').textContent=hit.object.userData.name});document.getElementById('close').onclick=()=>document.getElementById('info').classList.remove('show');
let dest=null;const views={iso:[26,15,26],front:[0,8,30],side:[30,8,0],top:[.01,34,.01]};
function view(v){dest=new THREE.Vector3(...views[v]);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.getElementById('reset').onclick=()=>{view('iso');document.getElementById('info').classList.remove('show')};document.getElementById('tags').onclick=e=>{const n=!tags[0].visible;tags.forEach(t=>t.visible=n);e.target.classList.toggle('active',n)};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});document.getElementById('loading').remove();function loop(){requestAnimationFrame(loop);if(dest){cam.position.lerp(dest,.09);if(cam.position.distanceTo(dest)<.03)dest=null}ctl.update();ren.render(sc,cam)}loop();
</script></body></html>
