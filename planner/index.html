<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客製化儲能案場規劃</title><link rel="stylesheet" href="css/styles.css"></head><body>
<div id="scene"></div><div id="loading">正在載入規劃畫面…</div>
<header class="heading panel"><strong>⚡ 客製化儲能案場規劃</strong><span id="modeLabel">YSPORK · 2 × 背對背</span></header>
<aside class="panel controls-panel"><div class="kicker">LAYOUT CONFIGURATION</div><h1>動態配置</h1><label>排列列數<select id="rowCount"><option value="1">一列 · Shinle</option><option value="2" selected>兩列 · Yspork</option></select></label><label>每列櫃數 <output id="cabinetCountValue">5</output><input id="cabinetCount" type="range" min="1" max="30" value="5"></label><label>櫃間距 <output id="cabinetSpacingValue">0.05 m</output><input id="cabinetSpacing" type="range" min="0" max="2" step="0.05" value="0.05"></label><label>列間距 <output id="rowGapValue">4.15 m</output><input id="rowGap" type="range" min="1.5" max="10" step="0.05" value="4.15"></label><div class="summary"><div><span>總櫃數</span><strong id="totalCabinets">10</strong></div><div><span>配置寬度</span><strong id="layoutWidth">11.85 m</strong></div><div><span>配置深度</span><strong id="layoutDepth">11.10 m</strong></div></div><p class="note">拖曳旋轉、滾輪縮放、右鍵平移；點擊儲能櫃查看編號。</p></aside>
<section id="info" class="panel info"><button id="close">✕</button><div class="kicker">EQUIPMENT DETAIL</div><h2 id="cabinetName">儲能櫃</h2><p id="cabinetDescription">設備資訊</p></section><nav class="toolbar panel"><button data-view="iso" class="active">立體總覽</button><button data-view="front">正面</button><button data-view="top">俯視配置</button><button id="reset">重設</button></nav>
